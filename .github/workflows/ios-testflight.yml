name: iOS TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Marketing version (for example 0.1)
        required: true
        default: "0.1"
        type: string
      build_number:
        description: Unique App Store Connect build number
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  test-archive-upload:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs and secrets
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY_BASE64; do
            [[ -n "${!name}" ]] || { echo "Missing required Actions secret: $name"; exit 1; }
          done

      - name: Swift Core tests
        working-directory: ios
        run: swift test

      - name: Simulator build and Xcode tests
        run: |
          set -o pipefail
          xcodebuild -project ios/AIQuickNote.xcodeproj -scheme AIQuickNote -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/simulator-build.log"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          xcodebuild test -project ios/AIQuickNote.xcodeproj -scheme AIQuickNote -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Import distribution signing assets
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aiquicknote-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/AIQuickNote.mobileprovision"
          API_KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/appstore-connect"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$P12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY"
          openssl pkey -in "$API_KEY" -noout
          if openssl pkcs12 -info -in "$P12" -passin env:APPLE_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo "OpenSSL PKCS12 validation: PASS"
          else
            echo "OpenSSL PKCS12 validation: FAIL" >&2
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            echo "macOS security import: PASS"
          else
            echo "macOS security import: FAIL" >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution:'
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist")
          [[ "$PROFILE_APP_ID" == 'Z36ZADH7T7.org.tmiai.aiquicknote' ]]
          [[ "$PROFILE_TEAM" == 'Z36ZADH7T7' ]]
          [[ "$PROFILE_NAME" == 'AIQuickNote App Store Distribution' ]]
          [[ "$PROFILE_TASK_ALLOW" == 'false' ]]
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "::add-mask::$APPLE_CERTIFICATE_PASSWORD"

      - name: Archive and export signed IPA
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/AIQuickNote.xcodeproj \
            -scheme AIQuickNote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AIQuickNote.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER=org.tmiai.aiquicknote \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM=Z36ZADH7T7 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            AIQ_TESTFLIGHT_PROFILE_SPECIFIER='AIQuickNote App Store Distribution' \
            CODE_SIGNING_ALLOWED=YES | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AIQuickNote.xcarchive" \
            -exportPath "$RUNNER_TEMP/appstore-connect" \
            -exportOptionsPlist .github/ExportOptions-TestFlight.plist | tee "$RUNNER_TEMP/xcodebuild-export.log"
          IPA=$(find "$RUNNER_TEMP/appstore-connect" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p release-artifact
          cp "$IPA" release-artifact/AIQuickNote-TestFlight.ipa
          unzip -q release-artifact/AIQuickNote-TestFlight.ipa -d "$RUNNER_TEMP/ipa-contents"
          APP="$RUNNER_TEMP/ipa-contents/Payload/AIQuickNote.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'org.tmiai.aiquicknote'
          codesign --verify --deep --strict "$APP"
          echo "Version: $MARKETING_VERSION ($BUILD_NUMBER)" > release-artifact/build-info.txt
          echo "Bundle ID: org.tmiai.aiquicknote" >> release-artifact/build-info.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIQuickNote-TestFlight-IPA
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        run: xcrun altool --upload-app --type ios --file release-artifact/AIQuickNote-TestFlight.ipa --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-failure-evidence
          path: |
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
            ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/aiquicknote-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
