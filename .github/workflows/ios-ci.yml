name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available

      - name: Swift Core tests
        working-directory: ios
        run: swift test

      - name: Python contracts and release invariants
        run: python3 -m unittest discover -s tests -v

      - name: Release simulator build and metadata validation
        run: |
          set -euo pipefail
          xcodebuild -project ios/AIQuickNote.xcodeproj -scheme AIQuickNote -sdk iphonesimulator -configuration Release -derivedDataPath ReleaseValidation CODE_SIGNING_ALLOWED=NO build | tee xcodebuild-release.log
          PLIST="ReleaseValidation/Build/Products/Release-iphonesimulator/AIQuickNote.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'org.tmiai.aiquicknote'
          test "$(/usr/libexec/PlistBuddy -c 'Print :FireseedIdentityEnvironment' "$PLIST")" = 'PRODUCTION'
          for key in FireseedIdentityEndpoint FireseedIdentityIssuer FireseedIdentityClientID; do
            test -z "$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST")"
          done

      - name: Xcode Simulator build
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AIQuickNote.xcodeproj \
            -scheme AIQuickNote \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-build.log

      - name: Select simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Selected iPhone simulator: $DEVICE_ID"

      - name: Xcode unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/AIQuickNote.xcodeproj \
            -scheme AIQuickNote \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log

      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-screenshots
          fi

      - name: Upload simulator interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-regression-evidence
          path: |
            TestResults.xcresult
            ui-screenshots
          if-no-files-found: ignore

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-failure-logs
          path: |
            xcodebuild-*.log
            TestResults.xcresult
          if-no-files-found: ignore
