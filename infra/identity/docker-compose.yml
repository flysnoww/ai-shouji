name: fireseed-identity-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/identity/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/identity/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/identity/.env}
    volumes:
      - identity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  logto:
    image: svhd/logto:1.43.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe --dapc && npm start"]
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TRUST_PROXY_HEADER: "1"
      ENDPOINT: ${LOGTO_ENDPOINT:-http://127.0.0.1:3001}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-http://127.0.0.1:3002}
    ports:
      - "127.0.0.1:${LOGTO_PORT:-3001}:3001"
      - "127.0.0.1:${LOGTO_ADMIN_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:3001/oidc/.well-known/openid-configuration'),fetch('http://127.0.0.1:3002')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  identity-postgres:
